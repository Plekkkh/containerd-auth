apiVersion: v1
kind: Pod
metadata:
  name: badpod-escape
  namespace: badpods
  labels:
    security: badpod
    role: escape-tester
spec:
  containers:
    - name: escape-tester
      image: alpine:latest
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: node-socket
          mountPath: /run/containerd/containerd.sock
  volumes:
    - name: node-socket
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket