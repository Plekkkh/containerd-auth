apiVersion: v1
kind: Pod
metadata:
  name: badpod-recon
  namespace: badpods
  labels:
    security: badpod
    role: attacker
spec:
  containers:
    - name: attacker
      image: alpine:latest
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        limits: {cpu: 100m, memory: 64Mi}