# Default Deny: весь ingress+egress в namespace client запрещен.
# Легитимные маршруты разрешаются отдельными политиками (11-*, 12-*, 13-*).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: client
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
