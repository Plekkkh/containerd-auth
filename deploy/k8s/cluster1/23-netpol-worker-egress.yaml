# job-worker egress: только DNS, redis и NodePort ноды кластера 2 через gateway docker-сети kind.
# ${DOCKER_GATEWAY} подставляется deploy.sh (docker network inspect kind).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-job-worker-egress
  namespace: client
spec:
  podSelector:
    matchLabels:
      app: job-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - ipBlock:
        cidr: "${DOCKER_GATEWAY}/32"
    ports:
    - protocol: TCP
      port: 30443
