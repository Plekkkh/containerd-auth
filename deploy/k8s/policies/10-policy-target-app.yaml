# AdmissionPolicy 1: разрешается деплой только целевого приложения.
# CREATE любого workload'а в ns core отклоняется, если:
#   - нет метки app.kubernetes.io/part-of: containerd-auth-lab, ИЛИ
#   - образ не из разрешенного списка (локальные образы лабы + whitelist).
# badPods живут в ns badpods и этим правилом не матчатся.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: target-app-only
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [ "apps" ]
        apiVersions: [ "v1" ]
        operations: [ "CREATE" ]
        resources: [ "deployments", "statefulsets", "daemonsets" ]
  validations:
    - expression: >-
        request.namespace != 'core' ||
        (has(object.spec.template.metadata.labels) &&
         object.spec.template.metadata.labels['app.kubernetes.io/part-of'] == 'containerd-auth-lab')
      message: "Деплой отклонен: разрешен деплой только целевому приложению с меткой app.kubernetes.io/part-of: containerd-auth-lab."
    - expression: >-
        request.namespace != 'core' ||
        object.spec.template.spec.containers.all(c,
          c.image.startsWith('docker.io/library/') ||
          c.image.startsWith('docker.io/cilium/') ||
          c.image.startsWith('ghcr.io/cilium/') ||
          c.image.endsWith(':local') ||
          !c.image.contains('/')
        )
      message: "Деплой отклонен: один или несколько образов не входят в разрешенный whitelist."