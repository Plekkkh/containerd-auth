# AdmissionPolicy 2: редактирование (UPDATE) только в сутки полнолуния.
#
# Реализация: Kyverno ValidatingPolicy.
#   - epoch-day = int((time.Now() - epoch) / 86400s) — целочисленное сравнение, без парсинга ISO 8601.
#   - список полнолуний (epoch-days) генерируется scripts/gen_fullmoon.py и подставляется
#     между маркерами BEGIN/END_FULLMOON_DAYS. Руками блок не править.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: fullmoon-edit-window
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      resources: ["deployments", "statefulsets", "daemonsets"]
      operations: ["UPDATE"]
  validations:
  # BEGIN_FULLMOON_DAYS
  - expression: >-
      int(request.time) / 86400
        in [20752, 20781, 20811, 20840, 20870, 20899, 20929, 20958, 20988, 21017, 21047, 21076, 21106, 21136, 21165]
    message: "Редактирование разрешено только в сутки полнолуния."
  # END_FULLMOON_DAYS
