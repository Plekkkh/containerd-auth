name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DEBUG: "true"
      JWT_SECRET: "3199277a63dc8017934e8b5586ee240163a728fbb08a984264df32ab8a56ef46"
      APP_DB_PATH: ":memory:"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "AdminTest999!"
      RUNTIME_ADAPTER: "fake"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  security:
    name: SAST
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit semgrep pip-audit

      - name: Bandit
        run: bandit -r app -q -f txt

      - name: Semgrep (OWASP Top 10)
        run: semgrep --config p/owasp-top-ten --error --quiet .

      - name: pip-audit
        run: pip-audit -r requirements.txt
